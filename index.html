<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Norman Fellows Scrapbook Viewer</title>

    <link rel="stylesheet" href="viewer.css">

    <script src="https://unpkg.com/mirador@4.0.0/dist/mirador.min.js"></script>
</head>

<body>

<div id="mirador"></div>

<script>
    Mirador.viewer({
        id: "mirador",
        windows: [
            {
                manifestId: "https://normanfellows.github.io/reading-territory/manifest.json"
            }
        ]
    });
</script>

</body>

</html>
